name: PR gate

# This repository does not accept pull requests from outside the admin team.
# GitHub offers no setting that prevents a PR from being opened, so this
# workflow enforces the policy instead: a PR whose author is not an
# organization owner is closed on arrival with an explanation.
#
# pull_request_target (not pull_request) so the close runs even for PRs from
# forks. Only the author association is read; no untrusted code is checked
# out or executed.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Close PRs from non-administrators
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$AUTHOR_ASSOCIATION" == "OWNER" ]]; then
            echo "Author is an organization owner; leaving open."
            exit 0
          fi
          gh pr close "$PR_NUMBER" --comment \
            "Thanks for the interest — this repository does not accept pull requests from outside the admin team, so this PR is being closed automatically. If you have a bug report or a proposal, please open an issue instead."
